<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraVoxel — Sandbox 2D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="src/ui/menu.js"></script>
    <script src="src/ui/dialogue.js"></script>
    <script src="src/world/workstation.js"></script>
    <script src="src/ui/craftingUI.js"></script>
    <script src="src/items/equipment.js"></script>
